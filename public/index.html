<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The-Ston — Projets</title>
  <meta name="description" content="La liste des projets de The-Ston : applications, outils et expérimentations.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧱</text></svg>">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <h1>The-Ston</h1>
      <p class="tagline">Mes projets perso : applis, outils et expérimentations. Le code est ouvert, les retours sont les bienvenus.</p>
      <a class="btn btn-ghost" href="https://github.com/The-Ston" rel="noopener">Profil GitHub</a>
    </div>
  </header>

  <main class="wrap">
    <section aria-labelledby="projects-title">
      <h2 id="projects-title">Projets</h2>
      <div id="projects" class="grid" aria-live="polite">
        <p class="muted">Chargement des projets…</p>
      </div>
      <noscript><p class="muted">Active JavaScript pour afficher les projets, ou consulte directement <a href="https://github.com/The-Ston">github.com/The-Ston</a>.</p></noscript>
    </section>
  </main>

  <footer class="wrap footer">
    <p>Un bug, une idée ? Ouvre une issue sur le dépôt du projet concerné.</p>
  </footer>

  <template id="card-tpl">
    <article class="card">
      <h3 class="card-title"></h3>
      <p class="card-desc"></p>
      <ul class="tags"></ul>
      <div class="card-actions"></div>
    </article>
  </template>
</body>
</html>
